# Copy to config.yaml and fill in. config.yaml is gitignored.

# Bot token from @BotFather for the agent team's OWN bot. Telegram allows
# only one polling consumer per bot, so this must NOT be a token already
# used elsewhere (e.g. by the Claude Code Telegram plugin) — that causes
# 409 Conflict. Leave empty to fall back to the TELEGRAM_BOT_TOKEN env var
# or .claude/settings.local.json.
telegram_token: ""

# Model powering the personas.
model: claude-sonnet-5

# Small/cheap model used only to pick which persona answers.
router_model: claude-haiku-4-5-20251001

# Telegram chat ids allowed to talk to the team. Message the bot and send
# /whoami to get yours, then add it here. Scheduled duties go to the first id.
allowed_chat_ids: []
#  - 123456789

# Obsidian vault root (a plain folder on this Mac). Example:
# "~/Library/Mobile Documents/iCloud~md~obsidian/Documents/<VaultName>"
vault_path: ""

# Folder where the Health Auto Export iPhone app drops JSON files. Example:
# "~/Library/Mobile Documents/iCloud~com~HealthExport~HealthAutoExport/Documents"
health_export_dir: ""

# Recurring duties, local time. "HH:MM" daily, "ddd HH:MM" weekly.
# Delete a line to disable that duty.
schedules:
  morning_triage: "07:00"   # Jeeves: tasks + reminders agenda
  midday_pulse: "13:00"     # Bennet: what's landed — tasks, people, links
  evening_capture: "17:30"  # Jeeves: worked on, people, new tasks, tomorrow
  habit_checkin: "21:00"    # Bartleby: fill today's habit-grid row
  weekly_recap: "sun 19:00" # Gatsby: wins recap (after the weekly review runs)

# How many transcript entries each persona sees.
history_limit: 40
